shared_rules:
- Authenticate by SAML2 ECP against https://www.leaseaccelerator.com/auth/api; there are no API keys.
- Every operation is a POST with `token` and `file` form fields; `file` is an <APIRequest> XML document.
- Read Response/Status from the <APIResponse> envelope. HTTP 200 does not mean the operation succeeded.
- Send ImportKey and ImportedFrom on every write so retries upsert rather than duplicate.
- Prefer ErrorPolicy=Stop so a failed batch rolls back cleanly.
- There is no pagination and no webhooks; asynchronous work is polled.
