- version: '26.3'
  date: '2026-07'
  latest: true
  url: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/47450362598413-26-3-Release-Notes
  breaking:
  - User Activity Log report retired — use User Activity Log v2.
  - Transaction Report retired — use Transaction Report v2.
  - >-
    Transaction Report v2 status columns renamed and reduced: the Status column between DealID and Lessee
    removed, Short Status renamed Deal Status Short, and the Status column between Current Payment and
    Vendors renamed Deal Status Long.
  additions:
  - New RFP Administrator access role in Access Control, with email notifications at RFP milestones.
  - Attached Documents report under Reporting - Administrative, restricted to Power Users and LAStaff.
  - Landing Dashboard moved to the v2 platform with seven analytical panels and drill-through reporting.
  - REM-LAM Reconciliation Report gains As At Date and Show Terminated Deals parameters plus four source-tagged financial columns.
  highlights:
  - Advanced Search redesigned across Deals and People/Contacts, with the separate Search button removed.
  - >-
    EOT Event pending-approval guardrail — nightly maintenance now checks for a pending EOT approval before
    recording a new end-of-term event, preventing duplicates.
  - Asset event recording now works without timeout on deals with 1,500 or more assets.
  - Further Ledger Export performance improvements.
  fixes:
  - Lease Abstract report no longer emits an extra $0 payment-schedule row for non-first-of-month payment dates.
  - Finance leases no longer generate an erroneous posting code 502 depreciation entry before the Available For Use Date.
  - Renewal payment schedules keep the original day-of-month through February renewals in non-leap years.
  - Maturity Analysis Report now includes future-dated non-remeasuring payment adjustments.
  - RFP release emails to chosen lessors no longer include LeaseAccelerator staff accounts.
- version: '26.2.1'
  date: '2026-06'
  url: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/46662953767949-26-2-1-Release-Notes
  additions:
  - >-
    Natural language search powered by Lineos AI — plain-language queries for deals, people, and companies
    in the Report Assist tab, with conversational context and pinnable results. Requires Lineos AI to be
    enabled for the organization.
  - User Admin v2 report (BYOR User Admin converted to the v2 platform, non-editable, wider export options).
  - Four lease date columns added to the REM-LAM Status Reconciliation Report; report now filters to REM-originated contracts only.
  - IBR added to the Operational Payment Business View in Design Studio.
  highlights:
  - Lease Lifecycle parameter Origination option (Incomplete and Pending Approval statuses) completed for Segregation of Duties.
  - >-
    Security remediations from penetration testing and automated vulnerability scanning — XSS protections,
    dependency upgrades, and script integrity controls on login pages.
  - Backend performance work on the database and reporting layers, including report status processing and stored procedure execution.
  fixes:
  - Include Adjusting Entries parameter on Ledger Export now correct for non-Gregorian fiscal years.
  - Deal Analysis Report Overview tab now sources IBR from the original takedown value, consistent with the rest of the report.
  - >-
    Full rollback of a booked deal schedule generates its adjusting entries again, fixing a regression
    introduced in 26.2; affected schedules are post-processed automatically.
