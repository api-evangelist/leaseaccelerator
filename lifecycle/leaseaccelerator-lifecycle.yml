  formal_policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  mechanism: >-
    Retirements are announced in the release notes under an explicit "Report Retirements" heading, naming
    the retired surface and its replacement, and instructing customers to migrate. There is no RFC 8594
    Sunset/Deprecation response header, no numeric deprecation window, and no separately published
    deprecation policy document.
  pattern: >-
    The observed pattern is versioned replacement rather than removal: a "v2" successor is shipped and runs
    alongside the original for one or more releases, then the original is retired in a later release note.
  recent_retirements:
