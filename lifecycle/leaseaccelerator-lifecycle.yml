description: >-
  How the LeaseAccelerator platform and its API change over time: the release cadence and version scheme,
  how retirements are announced, where availability is reported, and what commitments are published.
  LeaseAccelerator is a single-tenant-per-customer hosted platform, so there is no independently versioned
  API surface — API operations move with the platform release.

versioning:
  scheme: calendar-style platform release
  format: 'YY.N for feature releases, YY.N.N for interim releases (example: 26.3, 26.2.1)'
  current: '26.3'
  current_date: '2026-07'
  mechanism: >-
    No version header, no version path segment, and no per-account version pinning. All customers on a
    given environment run the same platform release, and API operations track it.
  historical_scheme: >-
    Prior to 2025 the scheme was YYRN (24R1, 24R2, 24R2.1, 24R2.2, 24R3). It changed to the dotted
    calendar form with the 25.1 release.
  cadence: >-
    Roughly quarterly feature releases with interim releases in between. Observed 2025-2026 sequence: 25.1,
    25.1.1 (March 2025), 25.2 (May 2025), 25.2.1 (June 2025), 25.3 (July 2025), 25.3.1 (September 2025),
    25.4 (October 2025), 26.1 (January 2026), 26.1.1 (March 2026), 26.2 (April 2026, deployed 15 March
    2026), 26.2.1 (June 2026), 26.3 (July 2026).
  changelog: changelog/leaseaccelerator-changelog.yml

deprecation:
