openapi: 3.1.0
info:
  title: LeaseAccelerator API
  version: '26.3'
  summary: REST-addressed, XML-RPC style API for the LeaseAccelerator enterprise lease lifecycle platform.
  description: 'The LeaseAccelerator API combines the simplicity of REST requests with the data exchange
    capabilities of XML Remote Procedure Calls (RPC). Each request is stateless and multiple method requests
    can be submitted concurrently from the same secure session.


    Access is secured by SAML2. Before submitting API requests you authenticate through the LeaseAccelerator
    SAML2 authentication layer (service provider URL `https://{environment}.leaseaccelerator.com/auth/api`,
    ECP mode against your own identity provider) and receive a text security token. Requests are then
    POSTed to `https://{environment}.leaseaccelerator.com/lease_accelerator/api/LeaseAccelerator/{operation}`
    with the `token` and `file` form fields, where `file` carries an `<APIRequest>` document.


    This description was generated by the API Evangelist enrichment pipeline from the publicly published
    LeaseAccelerator developer documentation. Operation keys, the URL template, the authentication model,
    and the request/response envelopes are taken verbatim from that documentation; per-field payload schemas
    are documented per operation in the API Methods reference and are not reproduced here.'
  termsOfService: https://insightsoftware.com/legal/terms-of-use/
  contact:
    name: LeaseAccelerator Support (insightsoftware)
    url: https://insightsoftware.com/support/
  x-generated-by: api-evangelist enrichment pipeline
  x-source-documentation: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895814655245-Application-Programming-Interface-API-for-Developers
externalDocs:
  description: Application Programming Interface (API) for Developers
  url: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895814655245-Application-Programming-Interface-API-for-Developers
servers:
- url: https://{environment}.leaseaccelerator.com/lease_accelerator/api/LeaseAccelerator
  description: LeaseAccelerator API endpoint. `environment` is the LeaseAccelerator environment being
    accessed (www for production); contact LeaseAccelerator Support for other environment URLs.
  variables:
    environment:
      default: www
      description: LeaseAccelerator environment; www is production.
tags:
- name: Reference Data
- name: Documents
- name: User Provisioning
- name: Search
- name: Reporting
- name: Process Status
- name: Portfolio
- name: Financials
- name: Events
paths:
  /AddUpdateAddress:
    post:
      operationId: AddUpdateAddress
      summary: Add/Update Address
      description: 'This method may be used to update existing addresses and/or to add new addresses.
        Addresses are specific workplaces in your organization where employees work and/or equipment may
        be physically located or shipped to. This would also include the physical location of any leased
        Real Estate. They are typically associated with a Lessee, Entity, or Business Unit. (There may
        be a 1: n relationship because companies may have multiple teams “sitting” at a single location.)


        Operation key: `AddUpdateAddress`. Reference: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895853166093-API-Methods'
      tags:
      - Reference Data
      externalDocs:
        description: API Methods reference
        url: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895853166093-API-Methods
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - token
              - file
              properties:
                token:
                  type: string
                  description: The security token returned by the SAML2 authentication service at /auth/api.
                file:
                  type: string
                  description: The XML <APIRequest> document carrying the Request envelope (RequestId,
                    WarningPolicy, ErrorPolicy) and the operation-specific <Payload>.
      responses:
        '200':
          description: An <APIResponse> document. A Status of 0 with Context "Ok" indicates success; any
            other Status value is an error described by Context.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '405':
          description: Method not allowed — the API accepts POST only.
        '500':
          description: Server error, or an invalid/expired security token.
