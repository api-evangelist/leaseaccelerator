components:
  schemas:
    APIRequest:
      type: object
      description: The generic LeaseAccelerator API request envelope, submitted as the `file` form field.
      xml:
        name: APIRequest
      properties:
        Request:
          type: object
          properties:
            RequestId:
              type: string
              description: A unique identifier you use to track the request. It is included in the response
                whether successful or not.
            WarningPolicy:
              type: string
              enum:
              - Stop
              - Skip
              - Ignore
              default: Ignore
              description: How LeaseAccelerator behaves when a warning is encountered. Stop rolls back
                the request; Ignore continues and reports warnings; Skip skips only the offending record
                in a multi-record request.
            ErrorPolicy:
              type: string
              enum:
              - Stop
              - Skip
              default: Stop
              description: How LeaseAccelerator behaves when an error is encountered. Stop rolls back
                the request; Skip skips only the offending record in a multi-record request.
        Payload:
          type: string
          description: The operation-specific XML request payload.
    APIResponse:
      type: object
      description: The generic LeaseAccelerator API response envelope.
      xml:
        name: APIResponse
      properties:
        Response:
          type: object
          properties:
            RequestId:
              type: string
              description: The unique identifier specified in the request.
            Status:
              type: integer
              description: A code indicating success or failure. Zero (0) always means success; any other
                value represents an error.
            Context:
              type: string
              description: A description of the overall request results. "Ok" always means success; any
                other value describes the error encountered.
        Payload:
          type: string
          description: The operation-specific XML response payload.
  securitySchemes:
    saml2Token:
      type: apiKey
      in: query
      name: token
      description: 'SAML2-issued text security token, submitted as the `token` form field on every POST.
        Obtain it by submitting a SAML2 ECP GET request to https://{environment}.leaseaccelerator.com/auth/api
        identifying your identity provider and a user federated for access in LeaseAccelerator. Note:
        OpenAPI has no native representation for a form-field credential, so it is modelled here as an
        apiKey; the token is transmitted in the multipart body, not the query string.'
security:
- saml2Token: []
