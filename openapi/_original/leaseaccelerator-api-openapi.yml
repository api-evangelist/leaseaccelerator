        or update multiple artifacts at once, at least two invocations will be needed to create a new
        deal containing multiple documents. (The first invocation will assign the dealId for the new deal,
        which can then be used in the subsequent invocation(s).)


        Operation key: `AddUpdateArtifact`. Reference: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895853166093-API-Methods'
