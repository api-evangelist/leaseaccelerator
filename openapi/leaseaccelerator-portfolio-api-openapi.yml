    post:
      operationId: ImportDeals
      summary: Import Deals
      description: 'This method provides a mechanism for importing specific information about each lease schedule and asset within your lease portfolio into LeaseAccelerator, in a single operation, with all information populated. It is modeled on the PIW workbook and is similar to the following tabs: The Schedule tab is the control list of your lease population and contains information about each lease that applies at the schedule level. The Details tab contains details for each piece of equipment or real estate c


        Operation key: `ImportDeals`. Reference: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895853166093-API-Methods'
      tags:
      - Portfolio
      externalDocs:
        description: API Methods reference
        url: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895853166093-API-Methods
      requestBody:
