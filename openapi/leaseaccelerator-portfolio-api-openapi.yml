      summary: Modify Deal Import
      description: 'This method provides a mechanism for modifying a lease schedule in a single operation. Note: This method does NOT run Lease Classification Engine. Please see Import and Classify Deals for invoking this process.


        Operation key: `ModifyDealImport`. Reference: https://docs-leaseaccelerator.insightsoftware.com/hc/en-us/articles/33895853166093-API-Methods'
