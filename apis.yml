aid: leaseaccelerator
name: LeaseAccelerator
description: >-
  LeaseAccelerator is an enterprise lease lifecycle automation platform for equipment and real estate
  leases, now part of insightsoftware. It combines lease accounting, lease administration, and asset
  lifecycle intelligence in a single purpose-built platform, automating compliance with ASC 842, IFRS 16,
  and GASB 87 through a full lease sub-ledger that protects the general ledger, automated classification
  and booking, roll-forward analytics with drill-down transparency, and deep ERP integrations. The
  platform exposes a SAML2-secured API that combines REST-addressed operations with XML Remote Procedure
  Call payloads, covering portfolio and deal import, asset and event recording, master and reference data
  synchronization, disbursements and FX rates, report generation and retrieval, search across deals,
  assets and contacts, and Single Sign-On user provisioning.
