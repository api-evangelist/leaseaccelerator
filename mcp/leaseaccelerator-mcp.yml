write_operations_excluded:
  rationale: The remaining 30 operations write to the lease sub-ledger, provision or revoke SSO credentials,
    or record irreversible end-of-term events. In a system whose output is journal entries posted to a
    customer's general ledger, these should not be autonomous agent tools. If exposed at all they belong
    behind explicit human confirmation with the request payload shown in full, and always with ErrorPolicy=Stop
    so a rejected batch rolls back cleanly.
