authentication:
  model: Any implementation must first complete the SAML2 ECP exchange against the customer's identity
    provider to obtain a security token, then pass that token as the `token` form field on every upstream
    call. The token represents a specific federated LeaseAccelerator user, so the agent inherits exactly
    that user's Access Control role and ScopeOfAccess — there is no way to narrow it further at the protocol
    level.
  detail: authentication/leaseaccelerator-authentication.yml
